  <!-- DIGIT 6 | px=322 py=40 | a,c,d,e,f,g=ON b=OFF -->
  <rect x="326" y="40" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="322" y="45" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="348" y="45" width="4" height="22" rx="1" fill="#1a0600"/>
  <rect x="326" y="68" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="322" y="73" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="348" y="73" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="326" y="96" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <text x="337" y="110" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#444">6</text>

  <!-- DIGIT 7 | px=360 py=40 | a,b,c=ON d,e,f,g=OFF -->
  <rect x="364" y="40" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="360" y="45" width="4" height="22" rx="1" fill="#1a0600"/>
  <rect x="386" y="45" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="364" y="68" width="22" height="4" rx="1" fill="#1a0600"/>
  <rect x="360" y="73" width="4" height="22" rx="1" fill="#1a0600"/>
  <rect x="386" y="73" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="364" y="96" width="22" height="4" rx="1" fill="#1a0600"/>
  <text x="375" y="110" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#444">7</text>

  <!-- DIGIT 8 | px=398 py=40 | all=ON -->
  <rect x="402" y="40" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="398" y="45" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="424" y="45" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="402" y="68" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="398" y="73" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="424" y="73" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="402" y="96" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <text x="413" y="110" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#444">8</text>

  <!-- DIGIT 9 | px=436 py=40 | a,b,c,d,f,g=ON e=OFF -->
  <rect x="440" y="40" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="436" y="45" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="462" y="45" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="440" y="68" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="436" y="73" width="4" height="22" rx="1" fill="#1a0600"/>
  <rect x="462" y="73" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="440" y="96" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <text x="451" y="110" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#444">9</text>

  <!-- ===== SECTION 2: ANATOMY ===== -->
  <text x="280" y="132" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" letter-spacing="3" fill="#444">SEGMENT ANATOMY</text>
  <rect x="20" y="138" width="520" height="190" fill="#0f0f0f" rx="6" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Large digit "8" (all ON) | px=60 py=152 | W=60 H=120 T=8 -->
  <!-- a: (px+8, py+0, 44, 8) -->
  <rect x="68" y="152" width="44" height="8" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <!-- f: (px+0, py+10, 8, 44) -->
  <rect x="60" y="162" width="8" height="44" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <!-- b: (px+52, py+10, 8, 44) -->
  <rect x="112" y="162" width="8" height="44" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <!-- g: (px+8, py+56, 44, 8) -->
  <rect x="68" y="208" width="44" height="8" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <!-- e: (px+0, py+66, 8, 44) -->
  <rect x="60" y="218" width="8" height="44" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <!-- c: (px+52, py+66, 8, 44) -->
  <rect x="112" y="218" width="8" height="44" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <!-- d: (px+8, py+112, 44, 8) -->
  <rect x="68" y="264" width="44" height="8" rx="1" fill="#ff6935" filter="url(#glow)"/>

  <!-- Segment letter labels -->
  <text x="90" y="148" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" fill="#ffb380">a</text>
  <text x="53" y="188" text-anchor="end"    font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" fill="#ffb380">f</text>
  <text x="127" y="188" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" fill="#ffb380">b</text>
  <text x="90" y="206" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" fill="#ffb380">g</text>
  <text x="53" y="244" text-anchor="end"    font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" fill="#ffb380">e</text>
  <text x="127" y="244" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" fill="#ffb380">c</text>
  <text x="90" y="285" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" fill="#ffb380">d</text>

  <!-- Right-side legend -->
  <text x="192" y="153" font-family="'Courier New', Courier, monospace" font-size="9" letter-spacing="1" fill="#555">SEG</text>
  <text x="228" y="153" font-family="'Courier New', Courier, monospace" font-size="9" letter-spacing="1" fill="#555">POSITION</text>
  <line x1="185" y1="158" x2="420" y2="158" stroke="#222" stroke-width="1"/>

  <text x="198" y="173" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#ff6935">a</text>
  <text x="214" y="173" font-family="'Courier New', Courier, monospace" font-size="10" fill="#666">top horizontal</text>

  <text x="198" y="191" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#ff6935">b</text>
  <text x="214" y="191" font-family="'Courier New', Courier, monospace" font-size="10" fill="#666">top-right vertical</text>

  <text x="198" y="209" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#ff6935">c</text>
  <text x="214" y="209" font-family="'Courier New', Courier, monospace" font-size="10" fill="#666">bottom-right vertical</text>

  <text x="198" y="227" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#ff6935">d</text>
  <text x="214" y="227" font-family="'Courier New', Courier, monospace" font-size="10" fill="#666">bottom horizontal</text>

  <text x="198" y="245" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#ff6935">e</text>
  <text x="214" y="245" font-family="'Courier New', Courier, monospace" font-size="10" fill="#666">bottom-left vertical</text>

  <text x="198" y="263" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#ff6935">f</text>
  <text x="214" y="263" font-family="'Courier New', Courier, monospace" font-size="10" fill="#666">top-left vertical</text>

  <text x="198" y="281" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#ff6935">g</text>
  <text x="214" y="281" font-family="'Courier New', Courier, monospace" font-size="10" fill="#666">middle horizontal</text>

  <line x1="185" y1="288" x2="420" y2="288" stroke="#222" stroke-width="1"/>
  <text x="185" y="302" font-family="'Courier New', Courier, monospace" font-size="9" fill="#3a3a3a">digit 8 = all 7 ON  ·  digit 1 = b + c only  ·  4 digits multiplexed at ~1 kHz</text>
</svg>
