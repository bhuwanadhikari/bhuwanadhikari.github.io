#-------------------------------
# Build Settings
markdown: kramdown
permalink: /:title
plugins:
  - jekyll-sitemap

# paginate: 9
# paginate_path: "/page/:num"

collections:
  projects:
    output: true
    permalink: /projects/:name/

# Pages Path
defaults:
  - scope:
      path: "_pages"
    values:
      permalink: /:basename:output_ext
  - scope:
      path: "_projects"
      type: projects
    values:
      layout: project

include:
  - _pages

sass:
  sass_dir: _sass
  style: compressed
