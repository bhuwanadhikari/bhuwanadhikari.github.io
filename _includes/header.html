<!-- begin header -->
<header class="header" id="top">
  <div class="container">
    <div class="row">
      <div class="header__inner col col-12">

        <div class="logo">
          <a class="logo__link" href="{{ site.baseurl }}/">
          {% if site.logo %}
            <img class="logo__image" src="{{ site.baseurl }}{{ site.logo }}" alt="{{ site.title }}">
          {% else %}
            <span style="display:inline-flex;align-items:center;gap:6px;"><img class="logo__icon" src="{{ site.baseurl }}/images/app/my_logo.png" alt="logo" style="height:40px;width:40px;object-fit:contain;clip-path:inset(10% round 6px);">{{ site.title }}</span>
          {% endif %}
          </a>
        </div>

        <nav class="main-nav">
          <div class="main-nav__box">
            <div class="nav__icon-close">
              <i class="ion ion-md-close"></i>
            </div>
            <div class="nav__title">Menu</div>
            <ul class="nav__list list-reset">
              <li class="nav__item">
                <a href="{{ site.baseurl }}/" class="nav__link">About</a>
              </li>
              <li class="nav__item">
                <a href="{{ site.baseurl }}/blogs/" class="nav__link">Blogs</a>
              </li>
              <li class="nav__item">
                <a href="{{ site.baseurl }}/projects/" class="nav__link">Projects</a>
              </li>
              <li class="nav__item">
                <a href="{{ site.baseurl }}/contact/" class="nav__link">Contact</a>
              </li>
              {% if site.color_scheme == "auto" %}
              <li class="nav__item nav__item-icon">
                <div class="toggle-theme">
                  <div class="toggle-moon" title="Enable dark mode"><i class="ion ion-ios-moon"></i></div>
                  <div class="toggle-sun" title="Enable light mode"><i class="ion ion-ios-sunny"></i></div>
                </div>
              </li>
              {% elsif site.color_scheme == "light" or site.color_scheme == "dark" %}
              {% else %}
              <li class="nav__item nav__item-icon">
                <div class="toggle-theme">
                  <div class="toggle-moon" title="Enable dark mode"><i class="ion ion-ios-moon"></i></div>
                  <div class="toggle-sun" title="Enable light mode"><i class="ion ion-ios-sunny"></i></div>
                </div>
              </li>
              {% endif %}
            </ul>
          </div>
        </nav>

        <div class="nav-button">
          <i class="nav__icon icon__menu ion ion-md-menu"></i>
          <!-- <i class="nav__icon icon__search ion ion-md-search"></i> -->
        </div>

      </div>
    </div>
  </div>
</header>
<!-- end header -->

{% include search.html %}
