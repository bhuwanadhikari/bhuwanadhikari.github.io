---
layout: default
title: Projects
permalink: /projects/
---

<div class="container">
  <div class="row projects-grid animate">
    {% if site.projects.size > 0 %}
      {% assign sorted_projects = site.projects | sort: "date" | reverse %}
      {% for post in sorted_projects %}
        {% include project-card.html %}
      {% endfor %}
    {% else %}
      <p>No projects yet.</p>
    {% endif %}
  </div>
</div>
