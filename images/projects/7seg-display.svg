<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340">
  <defs>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="560" height="340" fill="#0c0c0c" rx="12"/>

  <!-- ===== SECTION 1: ALL DIGITS 0-9 ===== -->
  <text x="280" y="22" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" letter-spacing="3" fill="#444">ALL DIGITS  0 – 9</text>
  <rect x="20" y="28" width="520" height="92" fill="#0f0f0f" rx="6" stroke="#1e1e1e" stroke-width="1"/>

  <!-- DIGIT 0 | px=94 py=40 | a,b,c,d,e,f=ON g=OFF -->
  <rect x="98" y="40" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="94" y="45" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="120" y="45" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="98" y="68" width="22" height="4" rx="1" fill="#1a0600"/>
  <rect x="94" y="73" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="120" y="73" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="98" y="96" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <text x="109" y="110" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#444">0</text>

  <!-- DIGIT 1 | px=132 py=40 | b,c=ON rest=OFF -->
  <rect x="136" y="40" width="22" height="4" rx="1" fill="#1a0600"/>
  <rect x="132" y="45" width="4" height="22" rx="1" fill="#1a0600"/>
  <rect x="158" y="45" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="136" y="68" width="22" height="4" rx="1" fill="#1a0600"/>
  <rect x="132" y="73" width="4" height="22" rx="1" fill="#1a0600"/>
  <rect x="158" y="73" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="136" y="96" width="22" height="4" rx="1" fill="#1a0600"/>
  <text x="147" y="110" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#444">1</text>

  <!-- DIGIT 2 | px=170 py=40 | a,b,d,e,g=ON c,f=OFF -->
  <rect x="174" y="40" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="170" y="45" width="4" height="22" rx="1" fill="#1a0600"/>
  <rect x="196" y="45" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="174" y="68" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="170" y="73" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="196" y="73" width="4" height="22" rx="1" fill="#1a0600"/>
  <rect x="174" y="96" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <text x="185" y="110" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#444">2</text>

  <!-- DIGIT 3 | px=208 py=40 | a,b,c,d,g=ON e,f=OFF -->
  <rect x="212" y="40" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="208" y="45" width="4" height="22" rx="1" fill="#1a0600"/>
  <rect x="234" y="45" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="212" y="68" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="208" y="73" width="4" height="22" rx="1" fill="#1a0600"/>
  <rect x="234" y="73" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="212" y="96" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <text x="223" y="110" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#444">3</text>

  <!-- DIGIT 4 | px=246 py=40 | b,c,f,g=ON a,d,e=OFF -->
  <rect x="250" y="40" width="22" height="4" rx="1" fill="#1a0600"/>
  <rect x="246" y="45" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="272" y="45" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="250" y="68" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="246" y="73" width="4" height="22" rx="1" fill="#1a0600"/>
  <rect x="272" y="73" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="250" y="96" width="22" height="4" rx="1" fill="#1a0600"/>
  <text x="261" y="110" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#444">4</text>

  <!-- DIGIT 5 | px=284 py=40 | a,c,d,f,g=ON b,e=OFF -->
  <rect x="288" y="40" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="284" y="45" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="310" y="45" width="4" height="22" rx="1" fill="#1a0600"/>
  <rect x="288" y="68" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="284" y="73" width="4" height="22" rx="1" fill="#1a0600"/>
  <rect x="310" y="73" width="4" height="22" rx="1" fill="#ff6935" filter="url(#glow)"/>
  <rect x="288" y="96" width="22" height="4" rx="1" fill="#ff6935" filter="url(#glow)"/>
